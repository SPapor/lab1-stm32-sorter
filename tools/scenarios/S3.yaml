# S3 - найгірший (методичка 6.1): перемальовка LCD + потік stats по UART як
# «довга передача даних» + посилки + E-STOP одночасно. docs/scenarios.md, S3.
name: S3
title: "Найгірший: LCD + потік stats + посилки + E-STOP"
setup: [stats reset, log on]
steps:
  - prompt: "Наступні 60 с скрипт шле stats двічі на секунду. Весь цей час роби посилки раз на 3-5 с (gate 10 лк -> 500 лк) і 5-10 разів тисни B1 у випадкові моменти. Enter - старт"
  - stream: {cmd: stats, rate_hz: 2, duration: 60}
  - wait_mcu: 2
final: [stats, load, stack, heap, hist gate, hist imu, hist lcd]
