# S2 - номінальний режим (методичка 6.1): посилки раз на кілька секунд, рідкі
# команди, журнал увімкнено. docs/scenarios.md, S2.
name: S2
title: "Номінальний: 10 посилок, рідкі команди, log on"
setup: [stats reset, log on]
steps:
  - prompt: "class-LDR на 500 лк (клас A). Далі 10 посилок. Посилка = gate-LDR на 10 лк ~1 с, потім назад 500 лк. Enter - старт"
  - repeat:
      times: 10
      steps:
        - prompt: "Посилка: gate 10 лк ~1 с -> 500 лк. Між посилками міняй class по колу 500 / 100 / 10 лк. Enter після посилки"
        - send: status
          wait: 2
  - wait_mcu: 5
final: [stats, load, stack, heap, hist gate, hist imu, hist lcd]
