# S2 - номінальний режим (методичка 6.1): посилки раз на 3 с, рідкі команди, журнал
# увімкнено. 30 посилок - щоб у FR-03 було ≥ 30 подій (методичка 6.3). docs/scenarios.md, S2.
# Без вікна - ~135 с часу МК (~3,5 хв реального): до межі wokwi-cli у 5 хв лишається ~1,5 хв.
# Лог S2_2026-11-12_1904 записано попередньою версією (wait_mcu: 15 замість підказки з auto: 15) -
# без вікна вони поводяться однаково, відрізняються лише позначки '# !' у лозі.
name: S2
title: "Номінальний: 30 посилок, рідкі команди, log on"
setup: [stats reset, log on]
steps:
  - prompt: "30 посилок: кожні 3 с gate 10 лк ~1 с -> 500 лк, class по колу 500 / 100 / 10 лк. Скрипт питатиме приблизно після кожних 5 і слатиме status. Enter - старт"
    auto: 0
  - repeat:
      times: 6
      steps:
        - prompt: "Ще 5 посилок (по одній кожні 3 с), потім Enter"
          auto: 15
        - send: status
  - wait_mcu: 3
final: [stats, load, stack, heap, hist gate, hist imu, hist lcd]
