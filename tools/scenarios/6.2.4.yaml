# 6.2.4 - відмова пристрою на I2C. Прошивка зібрана з make build TEST_I2C_FAULT=1
# (раз на секунду читання з відсутньої 0x69); ще кнопка sda_gnd у diagram.json
# замикає SDA на землю. docs/scenarios.md, 6.2.4.
name: "6.2.4"
title: "Відмова I2C: TEST_I2C_FAULT=1 і затиснута SDA"
setup: [stats reset, log on]
steps:
  - comment: "20 с з TEST_I2C_FAULT: I2C_RECOVER try=n/3, EVT i2c_fail/i2c_ok"
  - wait_mcu: 20
  - prompt: "Затисни жовту кнопку sda_gnd (SDA на GND) приблизно на 2 с і відпусти. Enter після цього"
  - wait_mcu: 10
final: [stats, hist imu, hist gate]
