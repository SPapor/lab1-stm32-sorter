# 6.2.6 - тривала робота >= 1 год у режимі S2: чи не росте купа, чи нормально
# переживає 32-бітний лічильник тактів переповнення раз на 89,5 с.
# Час - за мітками МК: Wokwi може йти повільніше за реальний час. docs/scenarios.md.
name: "6.2.6"
title: "Тривала робота 60 хв часу МК"
setup: [stats reset, log on]
steps:
  - prompt: "Зроби 3-5 посилок (gate 10 лк -> 500 лк), потім Enter. Далі 60 хв часу МК нічого не чіпати; вкладка симулятора має лишатися видимою"
  - repeat:
      times: 60
      steps:
        - wait_mcu: 60
        - send: heap
        - send: stack
  - prompt: "Ще 3-5 посилок наприкінці, потім Enter"
final: [stats, load, stack, heap, hist gate, hist imu, hist lcd]
