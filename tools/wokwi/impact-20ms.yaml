# Дії для tools/run_scenario.py --wokwi (wokwi-cli, час симуляції).
# Старт - на рядку SET name=go (скрипт шле set go 0 після setup), кінець - SET name=end.
# impact-20ms (FR-04 під навантаженням): 10 посилок класу A раз на 3 с, за 0,5 с до
# кожної - удар X = 2 g при Z = 1 g лише на 20 мс. Скрипт тим часом шле stats двічі
# на секунду, як у S3, і цикл стоїть до ~200 мс: скільки ударів побачить imu_task.
name: "impact-20ms удар 20 мс"
version: 1
