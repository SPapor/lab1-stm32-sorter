name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # ядро FreeRTOS: firmware/Middlewares/FreeRTOS

      - name: Docker image (docker/gcc10/Dockerfile, gcc 10.3.1)
        run: make image

      - name: Layer dependencies
        run: make check-deps

      - name: Host tools tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          make tools-test

      - name: Firmware build (LAB2_CAP harness, without PERF)
        run: make build LAB2_CAP=1

      - name: Firmware build (PERF=0)
        run: make build PERF=0

      - name: Firmware build (TEST_I2C_FAULT)
        run: make build TEST_I2C_FAULT=1

      - name: Firmware compile (ARCH=rtos, LTO=0) - -Werror and stack frames per file
        run: |
          make compile ARCH=rtos
          make compile ARCH=rtos OSMETRICS=1

      - name: Firmware build (ARCH=rtos, LTO=1, TICK_HZ=100)
        run: make build ARCH=rtos LTO=1 TICK_HZ=100

      - name: Firmware build (ARCH=rtos, LTO=1, PERF=0)
        run: make build ARCH=rtos LTO=1 PERF=0

      - name: Firmware build (ARCH=rtos, LTO=1, TEST_I2C_FAULT)
        run: make build ARCH=rtos LTO=1 TEST_I2C_FAULT=1

      - name: Firmware build (ARCH=rtos, LTO=1, SIM_CRIT=0 - port from the submodule as is)
        run: |
          make compile ARCH=rtos SIM_CRIT=0
          make build ARCH=rtos LTO=1 SIM_CRIT=0

      - name: Firmware build (ARCH=rtos, LTO=1, ASSERT=1 - configASSERT is not in the product)
        run: make build ARCH=rtos LTO=1 ASSERT=1

      - name: Firmware builds (ARCH=rtos, LTO=1) - test builds TEST_KSTRESS, TEST_APIPROBE, TEST_CRITCOST, TEST_INVERSION, OSMETRICS, TEST_OS
        run: |
          make build ARCH=rtos LTO=1 TEST_KSTRESS=1
          make build ARCH=rtos LTO=1 TEST_KSTRESS=1 SIM_CRIT=0
          make build ARCH=rtos LTO=1 TEST_APIPROBE=1
          make build ARCH=rtos LTO=1 TEST_CRITCOST=1
          make build ARCH=rtos LTO=1 TEST_INVERSION=sem
          make build ARCH=rtos LTO=1 TEST_INVERSION=mutex
          make build ARCH=rtos LTO=1 OSMETRICS=1
          make build ARCH=rtos LTO=1 OSMETRICS=1 SIM_CRIT=0
          make build ARCH=rtos LTO=1 TEST_OS=heap
          make build ARCH=rtos LTO=1 TEST_OS=heap_nohook
          make build ARCH=rtos LTO=1 TEST_OS=stack
          make build ARCH=rtos LTO=1 TEST_OS=stack_nocheck
          make build ARCH=rtos LTO=1 TEST_OS=stack_near
          make build ARCH=rtos LTO=1 TEST_OS=stack_near_nocheck
          make build ARCH=rtos LTO=1 TEST_OS=starve
          make build ARCH=rtos LTO=1 TEST_OS=qflood_drop
          make build ARCH=rtos LTO=1 TEST_OS=qflood_wait

      - name: Firmware build (ARCH=rtos, LTO=1) for upload
        run: |
          make build ARCH=rtos LTO=1
          cp firmware/build/firmware.elf firmware-rtos.elf

      - name: Firmware build (ARCH=superloop, LTO=1)
        run: make build LTO=1

      - name: Firmware build
        run: make build

      - name: Firmware builds (ARCH=qpc) - product with Q_UNSAFE, TEST_QSTRESS, TEST_QPCHECK, -Werror per file
        run: |
          make compile ARCH=qpc
          make compile ARCH=qpc TEST_QSTRESS=1
          make build ARCH=qpc LTO=1 TEST_QSTRESS=1
          make compile ARCH=qpc TEST_QPCHECK=1
          make build ARCH=qpc LTO=1 TEST_QPCHECK=1 PERF=0
          make build ARCH=qpc LTO=1 TEST_QPCHECK=1 PERF=0 TEST_Q93=estop
          make build ARCH=qpc LTO=1 TEST_QPCHECK=1 PERF=0 TEST_Q93=estopx
          make build ARCH=qpc LTO=1 TEST_QPCHECK=1 PERF=0 TEST_Q93=pool
          make build ARCH=qpc LTO=1 TEST_QPCHECK=1 PERF=0 TEST_Q93=poolx
          make build ARCH=qpc LTO=1

      - name: gcc 14 for comparison (docker/Dockerfile) - product builds only
        run: |
          make image-gcc14
          make build LTO=1 IMAGE=stm32-build:gcc14
          make build ARCH=rtos LTO=1 IMAGE=stm32-build:gcc14
          make build IMAGE=stm32-build:gcc10

      - name: Host tests
        run: make test

      - name: Coverage
        run: make coverage

      - name: Upload firmware.elf
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/firmware.elf
            firmware-rtos.elf

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/
